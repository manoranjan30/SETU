services:
  db:
    image: postgres:15-alpine
    container_name: setu_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: setu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: setu_app
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: admin
      DATABASE_PASSWORD: password
      DATABASE_NAME: setu_db
      JWT_SECRET: supersecretkey
      FIREBASE_SERVICE_ACCOUNT_PATH: firebase-service-account.json
      RUN_DB_MIGRATIONS: "true"
      DB_MIGRATION_SCRIPT: migration:run:dist
      UPLOAD_DIR: /usr/src/app/uploads
      APK_UPLOAD_MAX_MB: 500
      HTTP_REQUEST_TIMEOUT_MS: 120000
    volumes:
      - ./backend/uploads:/usr/src/app/uploads

volumes:
  postgres_data:
