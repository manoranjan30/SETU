<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SETU Documentation Viewer</title>
<style>
:root{--ink:#17212b;--muted:#65717d;--line:#d9e0e6;--panel:#f4f7f9;--accent:#146c94;--accent-soft:#e7f2f7;--code:#17202a}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff}.app{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);background:var(--panel);padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:20px;font-weight:750;margin:0 0 3px}.subtitle{color:var(--muted);font-size:12px;margin-bottom:15px}.actions{display:grid;gap:8px;margin-bottom:13px}.button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:9px 10px;cursor:pointer;text-align:left;color:var(--ink)}.button:hover{border-color:var(--accent);color:var(--accent)}.hint{font-size:12px;color:var(--muted);line-height:1.45;margin:0 0 14px}.search{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:#fff;margin-bottom:8px}.count{color:var(--muted);font-size:12px;margin:0 0 8px}.doc-list{display:grid;gap:3px}.doc-link{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:8px 9px;border-radius:5px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.doc-link:hover,.doc-link.active{background:var(--accent-soft);color:var(--accent)}.main{min-width:0}.toolbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:12px;position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);z-index:2}.toolbar-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolbar-actions{display:flex;gap:8px}.tool{border:1px solid var(--line);background:#fff;border-radius:5px;padding:6px 10px;cursor:pointer;color:var(--ink)}.tool:hover{border-color:var(--accent);color:var(--accent)}.content{max-width:1050px;margin:0 auto;padding:38px 48px 80px}h1{font-size:32px;line-height:1.2;margin:0 0 18px}h2{font-size:23px;line-height:1.3;border-bottom:1px solid var(--line);padding-bottom:5px;margin:36px 0 14px}h3{font-size:18px;margin:26px 0 9px}h4{font-size:16px;margin:20px 0 7px}p{margin:10px 0}a{color:var(--accent)}ul,ol{padding-left:24px}li{margin:3px 0}blockquote{border-left:3px solid #9ec8d9;margin:16px 0;padding:5px 16px;color:var(--muted);background:#f8fbfc}pre{background:var(--code);color:#eaf2f6;padding:15px;border-radius:6px;overflow:auto;line-height:1.45}code{font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;background:#eef2f4;padding:2px 4px;border-radius:3px}pre code{background:transparent;padding:0}table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px;display:block;overflow:auto}th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;min-width:100px}th{background:var(--panel);font-weight:650}.empty{color:var(--muted);padding:50px 0;text-align:center}.notice{background:#fff7df;border:1px solid #ead49a;border-radius:6px;padding:12px 14px;margin-bottom:22px;color:#5f4d1d}@media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px}.doc-list{max-height:240px;overflow:auto}.toolbar{padding:0 16px}.content{padding:26px 18px 60px}h1{font-size:27px}.toolbar-actions .tool{padding:5px 7px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">SETU Documentation</div>
    <div class="subtitle">Folder-based Markdown viewer</div>
    <div class="actions">
      <button id="folder" class="button">Open Documentation Folder</button>
      <label class="button" for="files">Choose Markdown Files</label>
      <input id="files" type="file" webkitdirectory multiple hidden>
    </div>
    <p class="hint">Select the <strong>Final Documentation</strong> folder. The viewer loads Markdown files on demand and does not embed or copy them.</p>
    <input id="search" class="search" type="search" placeholder="Filter files..." aria-label="Filter files">
    <div id="count" class="count">No folder selected</div>
    <nav id="doc-list" class="doc-list" aria-label="Documentation files"></nav>
  </aside>
  <main class="main">
    <header class="toolbar">
      <div id="toolbar-title" class="toolbar-title">Open the documentation folder to begin</div>
      <div class="toolbar-actions">
        <button id="print" class="tool">Print</button>
        <button id="raw" class="tool">Raw</button>
      </div>
    </header>
    <article id="content" class="content"><div class="empty">Choose the documentation folder or select Markdown files.</div></article>
  </main>
</div>
<script>
let files=new Map(), current=null, currentText='';
const list=document.getElementById('doc-list'), count=document.getElementById('count'), search=document.getElementById('search'), content=document.getElementById('content'), title=document.getElementById('toolbar-title');
const esc=(v)=>v.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function inline(v){let t=esc(v);t=t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2" style="max-width:100%">');t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,l,u)=>'<a href="'+u+'" target="_blank" rel="noreferrer">'+l+'</a>');t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\x60([^\x60]+)\x60/g,'<code>$1</code>');return t;}
function render(md){const lines=md.replace(/\r/g,'').split('\n'),out=[];let i=0,code=false,buf=[];while(i<lines.length){const line=lines[i];if(line.startsWith('\x60\x60\x60')){if(!code){code=true;buf=[]}else{out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');code=false}i++;continue}if(code){buf.push(line);i++;continue}if(!line.trim()){i++;continue}let h=line.match(/^(#{1,4})\s+(.*)$/);if(h){let n=h[1].length;out.push('<h'+n+'>'+inline(h[2])+'</h'+n+'>');i++;continue}if(/^---+$/.test(line.trim())){out.push('<hr>');i++;continue}if(line.startsWith('> ')){out.push('<blockquote>'+inline(line.slice(2))+'</blockquote>');i++;continue}if(/^\s*[-*] /.test(line)||/^\s*\d+\. /.test(line)){let ordered=/^\s*\d+\. /.test(line),items=[];while(i<lines.length&&(ordered?/^\s*\d+\. /.test(lines[i]):/^\s*[-*] /.test(lines[i]))){items.push(lines[i].replace(/^\s*(?:[-*]|\d+\.)\s+/,''));i++}out.push('<'+(ordered?'ol':'ul')+'>'+items.map(x=>'<li>'+inline(x)+'</li>').join('')+'</'+(ordered?'ol':'ul')+'>');continue}if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(lines[i+1])){const cells=x=>x.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(y=>y.trim()),heads=cells(line);i+=2;let rows=[];while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){rows.push(cells(lines[i]));i++}out.push('<table><thead><tr>'+heads.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+heads.map((_,j)=>'<td>'+inline(r[j]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>');continue}let p=[line];i++;while(i<lines.length&&lines[i].trim()&&!/^#{1,4}\s/.test(lines[i])&&!/^\s*[-*] /.test(lines[i])&&!/^\s*\d+\. /.test(lines[i])&&!lines[i].includes('|')){p.push(lines[i]);i++}out.push('<p>'+inline(p.join(' '))+'</p>')}return out.join('\n')}
function showList(){const q=search.value.toLowerCase(),items=[...files.keys()].filter(x=>x.toLowerCase().includes(q));count.textContent=items.length+' of '+files.size+' Markdown files';list.innerHTML=items.map(x=>'<button class="doc-link '+(x===current?'active':'')+'" data-path="'+esc(x)+'">'+esc(x)+'</button>').join('');list.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>openFile(b.dataset.path));}
async function readFile(path){const value=files.get(path);return value instanceof File?value.text():value.getFile().then(f=>f.text())}
async function openFile(path){const value=files.get(path);if(!value)return;current=path;currentText=await readFile(path);title.textContent=path;content.innerHTML=render(currentText);showList();window.scrollTo({top:0,behavior:'smooth'});}
function addFile(name,value){if(name.toLowerCase().endsWith('.md'))files.set(name.replaceAll('\\','/'),value)}
async function openFolder(){if(!window.showDirectoryPicker){alert('Folder picker is not supported in this browser. Use Choose Markdown Files instead.');return}try{const root=await window.showDirectoryPicker();files.clear();async function scan(dir,prefix=''){for await(const [name,h] of dir.entries()){if(name.startsWith('.'))continue;if(h.kind==='directory')await scan(h,prefix+name+'/');else addFile(prefix+name,h)}}await scan(root);current=null;showList();title.textContent='Documentation folder loaded';content.innerHTML='<div class="notice">Select a Markdown file from the left. Files are read only when opened.</div>'}catch(e){if(e.name!=='AbortError')alert('Could not open the folder: '+e.message)}}
document.getElementById('folder').onclick=openFolder;document.getElementById('files').onchange=(e)=>{files.clear();[...e.target.files].forEach(f=>addFile(f.webkitRelativePath||f.name,f));current=null;showList();title.textContent='Markdown files loaded';content.innerHTML='<div class="notice">Select a Markdown file from the left. Files are read only when opened.</div>'};search.oninput=showList;document.getElementById('print').onclick=()=>window.print();document.getElementById('raw').onclick=()=>{if(current)window.open(URL.createObjectURL(new Blob([currentText],{type:'text/markdown'})),'_blank')};
</script>
</body>
</html>
